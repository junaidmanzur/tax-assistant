services:
  # Combined Frontend + Backend Service (Free Tier Compatible)
  - type: web
    name: tax-assistant
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile.combined
    plan: free
    region: singapore  # Closest to Australia
    branch: main
    envVars:
      - key: OPENAI_API_KEY
        sync: false  # Set this manually in Render dashboard
    healthCheckPath: /docs