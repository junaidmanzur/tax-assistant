version: '3.8'

services:
  api-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api-gateway
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ../../.env:/app/.env

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway
    environment:
      - VITE_API_BASE=http://localhost:8000