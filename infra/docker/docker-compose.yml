version: '3.8'

volumes:
  qdrant_data:

services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api-gateway
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    depends_on:
      - qdrant

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway
    environment:
      - VITE_API_BASE=http://localhost:8000